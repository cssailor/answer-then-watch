plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvgate.quiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvgate.quiz"
        minSdk 22
        targetSdk 34
        versionCode 100
        versionName "0.2.0-standalone"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
