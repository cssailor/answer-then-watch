plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvgate.quiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvgate.quiz"
        minSdk 22
        targetSdk 34
        versionCode 2
        versionName "0.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
