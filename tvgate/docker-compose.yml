services:
  tvgate:
    build: .
    container_name: tvgate
    restart: unless-stopped

    # 用 bridge 网络，避免和 iStoreOS 宿主的 ADB server（5037）冲突。
    # 容器通过 NAT 出站连接 Fire TV 的 5555；家长端通过下面的端口映射暴露。
    ports:
      - "8765:8765"

    environment:
      - TZ=Asia/Shanghai
      - ADB_SERVER_PORT=5038

    volumes:
      - ./data:/app/data
      - ./adb:/root/.android
      - ./questions.json:/app/questions.json:ro

    command:
      - "--firetv"
      - "${FIRE_TV_IP:-192.168.1.50}"
      # bridge 网络下 local_ip() 是容器地址，必须显式告诉 App 走 NAS 的地址
      - "--server-url"
      - "${SERVER_URL:-http://192.168.1.10:8765}"
      - "--interval"
      - "${INTERVAL:-600}"
      - "--port"
      - "8765"
      - "--db"
      - "/app/data/tvgate.db"
